<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>修繕進度 · 總覽與明細</title>
<style>
:root{--ink:#163230;--muted:#60716d;--bg:#f4f6f2;--line:#dce4dd;--green:#21694f;--open:#a35c2b;--work:#467c9b;--done:#2a7658;--white:#fff;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}
header{background:#163c34;color:#fff;padding:22px 0}
h1{margin:0;font-size:26px}
.sub{color:#d3e4d8;font-size:13px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:18px}
.nums{font-size:13px;color:var(--muted)}
.nums strong{color:var(--ink)}
.view{display:none;margin-top:10px}
.view.active{display:block}
.filters{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
select,input{border:1px solid #cdd9ce;border-radius:10px;padding:7px 10px}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#f0f4ef;position:sticky;top:0}
.status{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px}
.status.open{background:#fde8d8;color:var(--open)}
.status.working{background:#e3f0f7;color:var(--work)}
.status.done{background:#e0f0e8;color:var(--done)}
.status.review{background:#eee;color:#666}
.back{background:none;border:none;color:var(--green);font-size:14px;cursor:pointer;margin-bottom:8px}
a.card{display:block;color:inherit;text-decoration:none}.nums,td{white-space:pre-wrap;overflow-wrap:anywhere}a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #3f8d68;outline-offset:3px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>修繕進度</h1>
  <div class="sub">點選棟別查看明細 · 公開去識別化資料 · 查核時間 <span id="vt"></span></div>
</div></header>
<div class="wrap">
  <p><a href="./index.html">← 返回首頁</a></p>
  <p id="load-state" role="status">正在載入修繕資料…</p>
  <div id="overview" class="view active">
    <div class="grid" id="cards"></div>
  </div>
  <div id="details" class="view">
    <button class="back" onclick="showOverview()">← 返回總覽</button>
    <h2 id="detail-title"></h2>
    <div class="filters">
      <select id="statusFilter" aria-label="篩選狀態"><option value="">全部狀態</option><option>未處理</option><option>處理中</option><option>已完成</option><option>待確認</option></select>
      <input id="search" aria-label="搜尋修繕明細" type="search" placeholder="搜尋案件、樓層、修繕內容或備註">
    </div>
    <p id="result-count" role="status"></p>
    <div class="table-wrap"><table id="table"><thead><tr><th>案件編號</th><th>樓層</th><th>缺失內容</th><th>工種</th><th>狀態</th><th>完成日期</th><th>備註</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
'use strict';
let DATA, currentRecords = [];
const letters = [...'ABCDEFG'];
const fields = ['caseId','floor','description','trade','status','completeDate','note'];
const statusKeys = {'未處理':'open','處理中':'working','已完成':'completed','待確認':'needs_review'};
const $ = id => document.getElementById(id);
function exactKeys(o, keys){return o && typeof o==='object' && !Array.isArray(o) && Object.keys(o).length===keys.length && keys.every(k=>Object.hasOwn(o,k));}
function validate(data){
  if(!exactKeys(data,['aggregates','details','verifiedAt']) || !exactKeys(data.aggregates,letters) || !exactKeys(data.details,letters) || typeof data.verifiedAt!=='string' || !/Z$|[+-]\d{2}:\d{2}$/.test(data.verifiedAt) || !Number.isFinite(Date.parse(data.verifiedAt))) throw Error('資料格式錯誤');
  for(const letter of letters){
    const b=data.details[letter],a=data.aggregates[letter];
    if(!exactKeys(b,['building','records']) || b.building!==letter+'棟' || !Array.isArray(b.records) || !exactKeys(a,['total','open','working','completed','needs_review'])) throw Error('棟別格式錯誤');
    const counts={total:b.records.length,open:0,working:0,completed:0,needs_review:0}, ids=new Set();
    for(const r of b.records){
      if(!exactKeys(r,fields) || fields.some(k=>typeof r[k]!=='string') || !Object.hasOwn(statusKeys,r.status) || !new RegExp('^'+letter+'-\\d{4}$').test(r.caseId) || ids.has(r.caseId)) throw Error('明細格式錯誤');
      ids.add(r.caseId); counts[statusKeys[r.status]]++;
    }
    if(Object.keys(counts).some(k=>!Number.isSafeInteger(a[k]) || a[k]!==counts[k])) throw Error('件數不符');
  }
  return data;
}
function showOverview(){
  $('overview').classList.add('active'); $('details').classList.remove('active');
  history.replaceState(null,'',location.pathname);
}
function showDetails(letter){
  if(!DATA || !Object.hasOwn(DATA.details,letter)) return;
  const b=DATA.details[letter]; currentRecords=b.records;
  $('statusFilter').value=''; $('search').value='';
  $('overview').classList.remove('active'); $('details').classList.add('active');
  $('detail-title').textContent=b.building+' 修繕明細';
  history.replaceState(null,'','?building='+letter); renderTable(currentRecords);
}
function statusClass(s){return {'未處理':'open','處理中':'working','已完成':'done','待確認':'review'}[s];}
function renderTable(recs){
  const status=$('statusFilter').value, q=$('search').value.trim().toLocaleLowerCase();
  const filtered=recs.filter(r=>(!status || r.status===status) && (!q || fields.some(k=>r[k].toLocaleLowerCase().includes(q))));
  const body=document.querySelector('#table tbody'); body.replaceChildren();
  for(const r of filtered){
    const tr=document.createElement('tr');
    for(const key of fields){const td=document.createElement('td');
      if(key==='status'){const badge=document.createElement('span');badge.className='status '+statusClass(r.status);badge.textContent=r.status;td.append(badge);}
      else td.textContent=r[key] || '—'; tr.append(td);
    } body.append(tr);
  }
  if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.textContent='無符合資料';tr.append(td);body.append(tr);}
  $('result-count').textContent='顯示 '+filtered.length+' / '+recs.length+' 筆';
}
$('statusFilter').addEventListener('change',()=>renderTable(currentRecords));
$('search').addEventListener('input',()=>renderTable(currentRecords));
(async()=>{
  try{
    const response=await fetch('./repair_public_data.json'); if(!response.ok) throw Error('載入失敗');
    DATA=validate(await response.json());
    $('vt').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Taipei'}).format(new Date(DATA.verifiedAt))+'（台北）';
    for(const letter of letters){const agg=DATA.aggregates[letter], card=document.createElement('a');card.className='card';card.href='?building='+letter;
      const title=document.createElement('h2');title.textContent=letter+'棟';const nums=document.createElement('div');nums.className='nums';nums.textContent='總計 '+agg.total+'\n未處理 '+agg.open+' · 處理中 '+agg.working+'\n已完成 '+agg.completed+' · 待確認 '+agg.needs_review;card.append(title,nums);
      card.addEventListener('click',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&e.button===0){e.preventDefault();showDetails(letter);}});$('cards').append(card);
    }
    $('load-state').textContent='依來源狀態欄分類，快照非即時進度；填表完成不等於人工驗收。';
    const letter=new URLSearchParams(location.search).get('building'); if(letters.includes(letter)) showDetails(letter);
  }catch{ $('load-state').textContent='資料載入失敗或格式不符，請稍後重新整理。';$('cards').replaceChildren();}
})();
</script>
</body>
</html>
